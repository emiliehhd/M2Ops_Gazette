services:
  app:
    build:
      context: .
      target: final
    env_file: .env
    volumes:
      - ./data:/home/gazette/data
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      GAZETTE_TEST_DSN: "host=db dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: